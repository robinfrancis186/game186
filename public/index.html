<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            width: 800px;
            height: 600px;
            margin: 20px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        #gameCanvas {
            background-color: #000000;
            border: 2px solid #333333;
            display: block;
        }

        #leaderboard {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            width: 200px;
            backdrop-filter: blur(5px);
        }

        #leaderboard h2 {
            margin: 0 0 10px 0;
            font-size: 16px;
            text-align: center;
            color: #ffffff;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        #leaderboard div {
            margin: 5px 0;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            padding: 2px 5px;
            border-radius: 3px;
        }

        #leaderboard div:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        #gameInfo {
            margin-top: 20px;
            text-align: center;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 5px;
            backdrop-filter: blur(5px);
        }

        #gameInfo p {
            margin: 5px 0;
            color: #ffffff;
        }

        #connectionStatus {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 14px;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
        }

        .connected {
            color: #00ff00;
        }

        .disconnected {
            color: #ff0000;
        }

        #loadingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #loadingOverlay.hidden {
            display: none;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #333;
            border-top: 5px solid #00ff00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="leaderboard"></div>
        <div id="connectionStatus" class="disconnected">Disconnected</div>
    </div>
    <div id="gameInfo">
        <p>Controls: WASD or Arrow Keys to move, Mouse to aim and shoot</p>
        <p>Collect power-ups and capture flags to score points!</p>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="./js/game.js"></script>
</body>
</html>
